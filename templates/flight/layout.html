    <body class="bg--gray">


      <div class="page-wrapper">
  
 
          <!--~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Start Header
      ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~-->
          <header class="header-section header-section-one">
              <div class="header">
                  <div class="header-bottom-area">
                      <div class="container-fluid">
                          <div class="header-menu-content">
                              <nav class="navbar navbar-expand-lg p-0">
                                  <a class="site-logo site-title" href="/index"><img src="{% static 'assets/images/logo.png' %}"
                                          alt="site-logo"></a>
                                  <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse"
                                      data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                                      aria-expanded="false" aria-label="Toggle navigation">
                                      <span class="fas fa-bars"></span>
                                  </button>
                                  <div class="collapse navbar-collapse" id="navbarSupportedContent">
                                      <ul class="navbar-nav main-menu ml-auto">
                                          <li class="menu_has_children"><a href="/dashboard">Dashboard</a></li>
                                          <li><a href="/profile">Profile</a></li>
                                          <li><a href="/bookings">My Bookings</a></li>
                                          <li><a href="/contact">Contact Us</a></li>
                                          <li><a href="#" onclick="document.getElementById('logout-form').submit(); return false;"><i class="ico_wallet"></i><span>Logout</span></a></li>
                                      </ul>
                                      <form id="logout-form" action="{% url 'logout' %}" method="post" style="display: none;">
                                          {% csrf_token %}
                                          <button type="submit">Logout</button>
                                      </form>
                                  </div>
                              </nav>
                          </div>
                      </div>
                  </div>
              </div>
          </header>
          <section class="banner-section inner-banner-section" style="padding: 50px 0; height: auto;">
              <div class="container-fluid">
                  <div class="row justify-content-center align-items-center">
                      <div class="col-xl-12 text-center">
                          <div class="banner-content">
                          </div>
                      </div>
                  </div>
              </div>
          </section>
          <!--~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          End Header
      ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~-->
  {% block parentBody %}
  {% endblock %}

      {% block body %}{% endblock %}
    </main>

    <footer class="footer-section section--bg pt-10" style="margin-top:auto; padding: 0; height: 2.5cm; overflow: hidden; display: flex; align-items: center ; justify-content: center;">


      <div class="footer-element" data-aos="fade-left" data-aos-duration="1200">
          <img src="{% static 'assets/images/element/element-1.png' %}" alt="element">
      </div>
      <div class="container">
          <div class="copyright-area">
              <div class="social-area">
                  <ul class="footer-social">
                      <li><a href="#0"><i class="fab fa-facebook-f"></i></a></li>
                      <li><a href="#0" class="active"><i class="fab fa-twitter"></i></a></li>
                      <li><a href="https://youtube.com/@flynext-v9b?si=_aPHt3ldyz4Yr-jD"><i class="fab fa-youtube"></i></a></li>
                      <li><a href="#0"><i class="fab fa-instagram"></i></a></li>
                  </ul>
              </div>
              <p>© 2024 Fly Next Airlines. All rights reserved.</p>
          </div>
      </div>
  </footer>
  <!--~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  End Footer
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~-->
